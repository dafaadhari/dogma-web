name: Deploy ke InfinityFree

on:
  push:
    branches:
      - main # Robot akan berjalan setiap ada push ke branch main

jobs:
  web-deploy:
    name: Upload FTP
    runs-on: ubuntu-latest
    steps:
    - name: Mengambil kode terbaru dari GitHub
      uses: actions/checkout@v4

    # =========================================================
    # FASE BARU: MERAKIT MESIN SEBELUM DIKIRIM
    # =========================================================
    - name: Menyiapkan PHP di Server Mesin GitHub
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Standar untuk Laravel 11

    - name: Merakit Mesin Laravel (Install folder vendor)
      run: composer install --no-dev --optimize-autoloader
    # =========================================================

    - name: Mengirim file ke InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs/ # Folder utama InfinityFree
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env.example
          README.md
          .env